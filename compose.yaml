services:
  notification-gateway:
    image: ghcr.io/newpaw/notification-gateway:latest
    container_name: notification-gateway
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://notify.novopacky.com}
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://ntfy:80}
      NTFY_TOKEN: ${NTFY_TOKEN}
      NTFY_USERNAME: ${NTFY_USERNAME:-}
      NTFY_PASSWORD: ${NTFY_PASSWORD:-}
      CHANNEL_TOPICS_JSON: ${CHANNEL_TOPICS_JSON}
      REST_API_KEYS_JSON: ${REST_API_KEYS_JSON}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      OAUTH_SELF_HOSTED: ${OAUTH_SELF_HOSTED:-false}
      OAUTH_LOGIN_PASSWORD: ${OAUTH_LOGIN_PASSWORD:-}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-notification-gateway}
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:-}
      OAUTH_REQUIRED_SCOPES: ${OAUTH_REQUIRED_SCOPES:-notifications:write}
      DATABASE_PATH: /data/notifications.db
    volumes:
      - notification-gateway-data:/data
    networks:
      - cloudflare

volumes:
  notification-gateway-data:

networks:
  cloudflare:
    external: true
