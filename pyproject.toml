[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "notification-gateway"
version = "0.1.0"
description = "Secure MCP and REST notification gateway for ntfy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.21,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=2.1,<3",
  "prometheus-client>=0.22,<1",
  "pydantic-settings>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
notification-gateway = "notification_gateway.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_gateway"]

[tool.pytest.ini_options]
addopts = "-q --cov=notification_gateway --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["notification_gateway"]

